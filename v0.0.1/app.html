<!DOCTYPE html>

<html lang>
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<link rel="icon" href="/favicon.ico">
		<link rel="manifest" href="/manifest.json">
		<title>中医AI问诊</title>
		<script src="cordova.js"></script>
		<script>
			document.addEventListener('deviceready', onDeviceReady, false);

			function onDeviceReady() {
				/* console.log('Running cordova-' + cordova.platformId + '@' + cordova.version); */
				window.open = cordova.InAppBrowser.open;
				var ref = cordova.InAppBrowser.open(
					'index.html',
					'_self',
					'location=yes,toolbar=yes'
				);
			}
		</script>
		<style>
			body {
				margin: 0;
				padding: 0;
				font-family: 'Microsoft YaHei', sans-serif;
				background: url('./images/1280.webp') no-repeat center center;
				background-size: cover;
				height: 100vh;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				color: #333;
				overflow: hidden;
			}

			.container {
				background-color: rgba(255, 255, 255, 0.7);
				border-radius: 15px;
				padding: 30px;
				box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
				text-align: center;
				max-width: 500px;
				position: relative;
				margin-bottom: 10rem;
			}

			h1 {
				color: #2a7f62;
				margin-bottom: 30px;
				font-size: 28px;
			}

			.loading-text {
				font-size: 20px;
				margin-bottom: 20px;
				color: #2a7f62;
			}

			.loading-dots {
				display: flex;
				justify-content: center;
				margin-bottom: 20px;
			}

			.dot {
				width: 12px;
				height: 12px;
				background-color: #2a7f62;
				border-radius: 50%;
				margin: 0 5px;
				opacity: 0.3;
				animation: pulse 1.5s infinite ease-in-out;
			}

			.dot:nth-child(1) {
				animation-delay: 0s;
			}

			.dot:nth-child(2) {
				animation-delay: 0.3s;
			}

			.dot:nth-child(3) {
				animation-delay: 0.6s;
			}

			@keyframes pulse {

				0%,
				100% {
					opacity: 0.3;
					transform: scale(0.8);
				}

				50% {
					opacity: 1;
					transform: scale(1.1);
				}
			}

			.tcm-elements {
				display: flex;
				justify-content: space-around;
				width: 100%;
				margin-top: 20px;
				font-size: 18px;
				color: #2a7f62;
			}

			.tcm-element {
				padding: 5px 10px;
				border-radius: 20px;
				background-color: rgba(42, 127, 98, 0.1);
			}
		</style>
	</head>

	<body>
		<div class="container">
			<h1>中 医 AI 问 诊</h1>
			<div class="loading-text">正在加载中...</div>
			<div class="loading-dots">
				<div class="dot"></div>
				<div class="dot"></div>
				<div class="dot"></div>
			</div>
			<div class="tcm-elements">
				<div class="tcm-element">方</div>
				<div class="tcm-element">便</div>
				<div class="tcm-element">智</div>
				<div class="tcm-element">能</div>
			</div>
		</div>
	</body>
</html>

<script>
	// 模拟加载过程
	document.addEventListener('DOMContentLoaded', function() {
		// 这里可以添加实际的加载逻辑
		//console.log("中医AI问诊系统正在初始化...");

		// 动态改变加载文字
		const loadingText = document.querySelector('.loading-text');
		const texts = [
			"系统正在加载中...",
			"请耐心等候...",
		];
		let counter = 0;

		setInterval(() => {
			loadingText.textContent = texts[counter % texts.length];
			counter++;
		}, 3000);
	});
</script>
