<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医智诊LOGO</title>
    <style>
        .logo-text {
            display: flex;
            align-items: center;
            font-family: 'Microsoft YaHei', sans-serif;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .logo-icon {
            width: 800px;
            height: 800px;
            background: linear-gradient(135deg, #4CAF50, #388E3C);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 500px;
            /* box-shadow: 0 3px 8px rgba(76, 175, 80, 0.3); */
            position: relative;
        }
        
        /* 添加叶子阴影效果 */
        .logo-icon i {
            position: relative;
            text-shadow: 0 6px 12px rgba(0,0,0,0.2);
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.15));
        }
        
        /* 可选：添加3D立体效果 */
        .logo-icon::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15) 0%, transparent 20%);
            border-radius: 50%;
        }
        
        .logo-name {
            font-size: 28px;
            letter-spacing: 1px;
            position: relative;
        }
        
        .logo-name::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(to right, #4CAF50, #8BC34A);
            border-radius: 2px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="logo-text">
        <div class="logo-icon">
            <i class="fas fa-leaf"></i>
        </div>
       <!-- <div class="logo-name">医智诊</div> -->
    </div>
</body>
</html>
